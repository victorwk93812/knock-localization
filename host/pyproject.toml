[project]
name = "knock-host"
version = "0.1.0"
description = "Laptop-side tools for the knock-localization bench tests"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "numpy>=2.0",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["bench"]
